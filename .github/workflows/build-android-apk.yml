name: Build Mod Knight Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies & verify tests + web build
        run: |
          npm install
          npm run typecheck
          npm test
          npm run build

      - name: Add Capacitor 7 Android & lock landscape fullscreen
        run: |
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npx cap add android
          npx cap sync android
          python3 -c '
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p, "r", encoding="utf-8").read()
          if "screenOrientation" not in s:
              s = s.replace("android:name=\".MainActivity\"", "android:name=\".MainActivity\" android:screenOrientation=\"sensorLandscape\"")
          open(p, "w", encoding="utf-8").write(s)
          '

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk mod-knight-debug.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mod-knight-android-apk
          path: mod-knight-debug.apk
          retention-days: 90

      - name: Publish Direct Download Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest-apk --yes || true
          git push origin :refs/tags/latest-apk || true
          gh release create latest-apk mod-knight-debug.apk \
            --title "魔改骑士 (Mod Knight) 安卓测试版 APK" \
            --notes "自动构建的最新安卓可安装 APK（横屏全屏版），直接点击下方 mod-knight-debug.apk 即可下载安装！"
